version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bnbo-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bnbo
      - POSTGRES_PASSWORD=bnbo
      - POSTGRES_DB=bnbo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnbo -d bnbo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: bnbo-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
